[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aaak-provider"
version = "1.0.0"
description = "AAAK Compression Provider for hermes-lcm - deterministic AI-readable compression"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Hermes Agent", email = "hermes@nousresearch.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
benchmark = [
    "tiktoken>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aaak_provider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --tb=short"